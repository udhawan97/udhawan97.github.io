<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Orifold app icon">
  <defs>
    <linearGradient id="ofBg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3350"/>
      <stop offset="1" stop-color="#63b7cf"/>
    </linearGradient>
    <linearGradient id="ofSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ofGlow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#bdeeff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bdeeff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ofSoft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#0a1622" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="23" fill="url(#ofBg)"/>
  <circle cx="78" cy="18" r="42" fill="url(#ofGlow)"/>
  <rect x="0" y="0" width="100" height="100" rx="23" fill="url(#ofSheen)"/>
  <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="22.4" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>
  <!-- Origami crane, low-poly paper facets -->
  <g filter="url(#ofSoft)">
    <!-- body: neck -> top ridge -> tail-body joint -> tail tip -> belly -->
    <polygon points="24,44 50,27 65,47 87,55 53,75" fill="#f3f5f8" opacity="0.94"/>
    <!-- belly fold shadow -->
    <polygon points="50,27 65,47 53,75" fill="#c9d2dc" opacity="0.5"/>
    <!-- head + beak -->
    <polygon points="11,33 24,44 27,35" fill="#f3f5f8" opacity="0.94"/>
    <!-- tail fin fold shadow -->
    <polygon points="65,47 87,55 76,61" fill="#c9d2dc" opacity="0.55"/>
    <!-- wing: gentle flap around shoulder joint (50,27) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 50 27; 3 50 27; -6 50 27" dur="3.6s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45,0,0.55,1;0.45,0,0.55,1" repeatCount="indefinite"/>
      <polygon points="50,27 33,5 65,47" fill="#ffffff" opacity="0.98"/>
      <polygon points="50,27 33,5 46,23" fill="#dbe2ea" opacity="0.6"/>
    </g>
  </g>
</svg>
