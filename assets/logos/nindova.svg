<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="nindova-title nindova-desc">
  <title id="nindova-title">Nindova</title>
  <desc id="nindova-desc">Four paired diamonds breathe around one quiet saffron center.</desc>
  <style>
    .nindova-pair {
      transform-box: fill-box;
      transform-origin: center;
      animation: nindova-pair-live 5.4s cubic-bezier(.65, 0, .35, 1) infinite;
    }
    .nindova-pair.two { animation-delay: -1.35s; }
    .nindova-pair.three { animation-delay: -2.7s; }
    .nindova-pair.four { animation-delay: -4.05s; }
    .nindova-center {
      transform-box: fill-box;
      transform-origin: center;
      animation: nindova-center-live 5.4s ease-in-out infinite;
    }
    @keyframes nindova-pair-live {
      0%, 100% { opacity: .84; transform: scale(.95); }
      28%, 55% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes nindova-center-live {
      0%, 100% { transform: rotate(0deg) scale(.94); }
      50% { transform: rotate(90deg) scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nindova-pair,
      .nindova-center { animation: none !important; }
    }
  </style>
  <rect width="512" height="512" rx="112" fill="#10143a"/>
  <circle cx="256" cy="256" r="178" fill="#3a4a9e" opacity=".14"/>
  <g transform="translate(21.334 21.334) scale(9.778)">
    <g class="nindova-pair one" fill="#9a3a42">
      <path d="M24 3.4 29 8.4 24 13.4 19 8.4Z"/>
      <path d="M24 34.6 29 39.6 24 44.6 19 39.6Z"/>
    </g>
    <g class="nindova-pair two" fill="#3a4a9e">
      <path d="M8.4 19 13.4 24 8.4 29 3.4 24Z"/>
      <path d="M39.6 19 44.6 24 39.6 29 34.6 24Z"/>
    </g>
    <g class="nindova-pair three" fill="#c4638a">
      <path d="M31.8 11.2 36.8 16.2 31.8 21.2 26.8 16.2Z"/>
      <path d="M16.2 26.8 21.2 31.8 16.2 36.8 11.2 31.8Z"/>
    </g>
    <g class="nindova-pair four" fill="#efe1c4">
      <path d="M16.2 11.2 21.2 16.2 16.2 21.2 11.2 16.2Z"/>
      <path d="M31.8 26.8 36.8 31.8 31.8 36.8 26.8 31.8Z"/>
    </g>
    <path class="nindova-center" d="M24 19 29 24 24 29 19 24Z" fill="#e0a64b"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
</svg>
