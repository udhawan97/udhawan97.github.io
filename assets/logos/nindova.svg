<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="nindova-title nindova-desc">
  <title id="nindova-title">Nindova</title>
  <desc id="nindova-desc">Four color pairs stitch into place before a saffron center closes the mark.</desc>
  <style>
    .nindova-glow {
      opacity: 0;
      animation: nindova-glow-live 7s ease-in-out infinite;
    }

    .nindova-diamond {
      opacity: 0;
      animation: nindova-stitch 7s steps(1, end) infinite;
    }

    .nindova-pair-one { animation-delay: 0s; }
    .nindova-pair-two { animation-delay: .35s; }
    .nindova-pair-three { animation-delay: .7s; }
    .nindova-pair-four { animation-delay: 1.05s; }
    .nindova-center { animation-delay: 1.6s; }

    @keyframes nindova-stitch {
      0% { opacity: 0; }
      6%, 88% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }

    @keyframes nindova-glow-live {
      0%, 100% { opacity: 0; }
      55% { opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nindova-diamond {
        animation: none !important;
        opacity: 1;
      }

      .nindova-glow {
        animation: none !important;
        opacity: 0;
      }
    }
  </style>
  <defs>
    <radialGradient id="nindova-stitch-glow">
      <stop offset="0" stop-color="#e0a64b" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#e0a64b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#10143a"/>
  <circle cx="256" cy="256" r="178" fill="#3a4a9e" opacity=".14"/>
  <circle class="nindova-glow" cx="256" cy="256" r="224" fill="url(#nindova-stitch-glow)"/>
  <g transform="translate(21.334 21.334) scale(9.778)">
    <g class="nindova-diamond nindova-pair-one" fill="#9a3a42">
      <path d="M24 3.4 29 8.4 24 13.4 19 8.4Z"/>
      <path d="M24 34.6 29 39.6 24 44.6 19 39.6Z"/>
    </g>
    <g class="nindova-diamond nindova-pair-two" fill="#3a4a9e">
      <path d="M8.4 19 13.4 24 8.4 29 3.4 24Z"/>
      <path d="M39.6 19 44.6 24 39.6 29 34.6 24Z"/>
    </g>
    <g class="nindova-diamond nindova-pair-three" fill="#c4638a">
      <path d="M31.8 11.2 36.8 16.2 31.8 21.2 26.8 16.2Z"/>
      <path d="M16.2 26.8 21.2 31.8 16.2 36.8 11.2 31.8Z"/>
    </g>
    <g class="nindova-diamond nindova-pair-four" fill="#efe1c4">
      <path d="M16.2 11.2 21.2 16.2 16.2 21.2 11.2 16.2Z"/>
      <path d="M31.8 26.8 36.8 31.8 31.8 36.8 26.8 31.8Z"/>
    </g>
    <path class="nindova-diamond nindova-center" d="M24 19 29 24 24 29 19 24Z" fill="#e0a64b"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
</svg>
