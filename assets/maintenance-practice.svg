  <text x="72" y="158" fill="#f1eee4" font-family="Georgia,serif" font-size="43">Build with care.</text>
  <text x="72" y="207" fill="#a9c9da" font-family="Georgia,serif" font-size="43" font-style="italic">Keep improving.</text>
  <text x="72" y="268" fill="#b8c6c9" font-family="Arial,sans-serif" font-size="16">Human direction. AI-assisted delivery.</text>
