<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Umang Dhawan — thoughtful systems, maintained with care</title>
  <desc id="desc">An indigo and paper engineering fieldbook. Choose, build, verify, ship, and learn form a feedback loop. Daily Elf implements, Mobster follows through, Auditor questions, and Weekly CAPO prioritizes. Umang sets the direction and remains accountable.</desc>
